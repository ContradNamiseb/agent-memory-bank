name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: dotnet test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore AgentMemoryBank.slnx

      - name: Run tests
        run: dotnet test AgentMemoryBank.slnx --no-restore --verbosity normal
